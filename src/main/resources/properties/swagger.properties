# ----------------------------------------
# DOCS PROPERTIES
# ----------------------------------------
springdoc.version=@springdoc.version@
springdoc.show-login-endpoint=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.packages-to-scan=com.clubchretien
springdoc.paths-to-match=/**
springdoc.paths-to-exclude=
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=*/*
springdoc.show-actuator=false
springdoc.cache.disabled=false
springdoc.auto-tag-classes=true
springdoc.override-with-generic-response=true
springdoc.api-docs.groups.enabled=true
springdoc.model-and-view-allowed=false
# --------------------------------------------
# swagger api info
# -------------------------------------------
swagger.group.name=com.clubchretien
swagger.path.mapping=/
swagger.metadata.title=${spring.application.name}
swagger.metadata.description=All end point of 
swagger.metadata.company=DIRECT PAY
swagger.metadata.website=https://owomi.com
swagger.metadata.email=contact@owomi.com
swagger.metadata.licence.name=All Rights Reserved by ${swagger.metadata.company}.
swagger.metadata.licence.url=${swagger.metadata.website}/licence
swagger.metadata.term.service=${swagger.metadata.website}/terms/licence
swagger.documentation.name=Documentation
swagger.documentation.url=${spring.application.name}/swagger-ui.html

