spring.profiles.active=@spring.profiles.active@
# ----------------------------------------
# FIREBASE PROPERTIES
# ----------------------------------------
firebase.service.token.file=firebase-service-clubchretien/firebase-service-account-${spring.profiles.active}.json
firebase.config.url=https://jawupay-bbc9f.firebaseio.com
# ----------------------------------------
# LOGGING PROPERTIES
# ----------------------------------------
logging.level.org.springframework.boot.autoconfigure=ERROR
logging.level.com.owomi=debug
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.level.org.hibernate.SQL=info
# ----------------------------------------
# MONITORING PROPERTIES prometheus
# ----------------------------------------
management.security.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
opentracing.jaeger.http-sender.url=${JAEGER_SENDER_URL}/api/traces
opentracing.jaeger.log-spans=false
# ----------------------------------------
# PAGEABLE PROPERTIES
# ----------------------------------------eFelIyfDEJMnFUyNRnbosGytBeIRsOTPi7T6fTJyp
spring.data.web.pageable.size-parameter=size
spring.data.web.pageable.page-parameter=page
spring.data.web.pageable.default-page-size=5
spring.data.web.pageable.one-indexed-parameters=false
spring.data.web.pageable.max-page-size=2000
spring.data.web.pageable.prefix=
spring.data.web.pageable.qualifier-delimiter=_
spring.main.allow-bean-definition-overriding=true
# application.properties
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# ----------------------------------------
# HIKARI PROPERTIES
# ----------------------------------------
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=HikariCorePool
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
# ----------------------------------------
# DOCS PROPERTIES
# ----------------------------------------
springdoc.swagger-ui.operationsSorter=method
springdoc.show-actuator=false


#######################################
# REDIS CONFIG
########################################

# Hôte du serveur Redis (localhost si tu testes en local)
spring.redis.host=${REDIS_HOST}

# Port par défaut de Redis
spring.redis.port=${REDIS_PORT}

# Mot de passe si ton Redis en a un (sinon laisse vide)
spring.redis.password=${REDIS_PASSWORD}

# Base de données Redis à utiliser (0 = par défaut, tu peux en avoir plusieurs)
spring.redis.database=0

# Timeout de connexion (en ms)
spring.redis.timeout=60000


####################################
# CACHE SPRING (utilise Redis comme moteur de cache)
####################################

# Type de cache ? Redis
spring.cache.type=redis

# Temps de vie par défaut des entrées en cache (ici 10 minutes)
spring.cache.redis.time-to-live=600000

# Autoriser les valeurs nulles dans le cache (souvent on met false)
spring.cache.redis.cache-null-values=false

# Mettre les valeurs en cache avec compression (utile si données volumineuses)
spring.cache.redis.use-key-prefix=true

# Préfixe pour éviter les collisions si plusieurs applis utilisent le même Redis
spring.cache.redis.key-prefix=abonnement-service::

spring.cache.redis.cache-names.refreshTokens.time-to-live=3600000