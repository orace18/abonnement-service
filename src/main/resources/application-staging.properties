# ----------------------------------------
# SERVER PROPERTIES
# ----------------------------------------
server.port=8081
server.servlet.context-path=/abonnement-serivce
# ----------------------------------------
# DATABASE PROPERTIES
# ----------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://staging-db:5432/owomi_database}
spring.datasource.username=${DB_USERNAME:staging_user}
spring.datasource.password=${DB_PASSWORD:staging_password}
spring.datasource.driver-class-name=org.postgresql.Driver
# ----------------------------------------
# JPA PROPERTIES
# ----------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
