services:
  spring-app:
    image: ${IMAGE_FULL} 
    container_name: ${CI_PROJECT_NAME}
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=dev

      - DB_PORT=5432
      - DB_HOST=${DATABASE_URL}
      - DB_USER=${DATABASE_USER}
      - DB_PASSWORD=${DATABASE_PASSWORD}

      - NEO4J_URL=${NEO4J_URL}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}

      - JWT_SECRET=${JWT_SECRET}
      
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}

    labels:
    - "traefik.enable=true"
    - "traefik.docker.network=traefik_net"
    - "traefik.http.routers.abonnement-service.rule=Host(`${API_DOMAIN}`) && PathPrefix(`/${CI_PROJECT_NAME}`)"
    - "traefik.http.routers.abonnement-service.entrypoints=websecure"
    - "traefik.http.routers.abonnement-service.tls.certresolver=myresolver"
    - "traefik.http.services.abonnement-service.loadbalancer.server.port=${APP_PORT}"

    networks:
      - traefik_net
      - pgsql_net
      - club_chretien_net

networks:
  traefik_net:
    external: true
  pgsql_net:
    external: true
  club_chretien_net:
    external: true
    